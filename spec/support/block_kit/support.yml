schema_version: 2
checked_on: "2026-09-27"
scope: Checked Block Kit values, surface builders, static selections, overflow menus, checkboxes, radio buttons, user selects, channel selects, date/time pickers, the datetime picker, video blocks, external selects with block_suggestion option responses, remote file blocks, rich text display blocks, table blocks, number inputs, file inputs, URL inputs, and email inputs, including Input in Messages, FormModal and Home and modal-only Input children in FormModal.
statuses:
  - unsupported
  - partial
  - supported
entries:
  - wire_type: clear response action
    kind: interaction acknowledgment
    documentation_url: https://docs.slack.dev/surfaces/modals/#close-all-views
    fields_supported: [response_action]
    parents: [view_submission]
    surfaces: [modal]
    restrictions: ModalClear emits only the fixed clear action. Applications return HTTP 200 JSON within three seconds to close all views; an empty HTTP 200 closes only the submitted view. No token, API dispatch or local stack tracking. Legacy Modal::CLOSE remains unchanged. Offline evidence does not prove live closure or timing.
    implementation_status: supported
    inbound_status: unsupported
    evidence_paths: [src/slack/interactions/modal_clear.cr, spec/interactions/modal_clear_spec.cr, examples/support/modal_clear_example.cr, spec/block_kit_consumers_spec.cr]

  - wire_type: push response action
    kind: interaction acknowledgment
    documentation_url: https://docs.slack.dev/surfaces/modals/#add-a-new-view-via-response_action
    fields_supported: [response_action, view]
    parents: [view_submission]
    surfaces: [modal]
    restrictions: ModalPush owns a checked FormModal or DisplayModal snapshot and returns a snapshot accessor. Existing modal validation and placement rules apply. Metadata and external_id stay inside view. Applications return HTTP 200 JSON within three seconds; Slack owns stack state and the three-view limit. No token, trigger, hash, API dispatch, retry or deadline enforcement.
    implementation_status: supported
    inbound_status: unsupported
    evidence_paths: [src/slack/interactions/modal_push.cr, spec/interactions/modal_push_spec.cr, examples/support/modal_push_example.cr, spec/block_kit_consumers_spec.cr]

  - wire_type: update response action
    kind: interaction acknowledgment
    documentation_url: https://docs.slack.dev/surfaces/modals/#update-a-view-via-response_action
    fields_supported: [response_action, view]
    parents: [view_submission]
    surfaces: [modal]
    restrictions: ModalUpdate owns a checked FormModal or DisplayModal snapshot and exposes a snapshot accessor. Existing modal validation and placement apply. Only the currently visible submitted view can be updated this way. Applications verify signed submissions and return HTTP 200 JSON within three seconds. No token, target selector, trigger, hash, transport, or remote state tracking. Retained input IDs are application-owned; metadata stays inside view.
    implementation_status: supported
    inbound_status: unsupported
    evidence_paths: [src/slack/interactions/modal_update.cr, spec/interactions/modal_update_spec.cr, examples/support/modal_update_example.cr, spec/block_kit_consumers_spec.cr]

  - wire_type: errors response action
    kind: interaction acknowledgment
    documentation_url: https://docs.slack.dev/surfaces/modals/#display-errors-in-views
    fields_supported: [response_action, errors]
    parents: [view_submission]
    surfaces: [modal]
    restrictions: ModalErrors owns a block-ID to plain-text message map and returns a copied accessor. Nonempty maps and nonblank messages are library policy. Callers verify Input block membership, apply business validation and return HTTP 200 JSON within three seconds. No API dispatch; other response actions are separate values.
    implementation_status: supported
    inbound_status: unsupported
    evidence_paths: [src/slack/interactions/modal_errors.cr, spec/interactions/modal_errors_spec.cr, examples/support/modal_errors_example.cr, spec/block_kit_consumers_spec.cr]


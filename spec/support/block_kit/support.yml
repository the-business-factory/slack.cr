  - id: container_block
    classification: slack_requirement
    requirement: "title (plain_text, 150) or rich_text_title (a rich_text block) is required; rich_text_title wins when both are sent. subtitle is plain_text or mrkdwn, 150. child_blocks is required, up to 10 blocks of actions, context, divider, file, header, image, input, rich_text, section, table, or video. width is narrow, standard, wide, or full. icon is an image element; alt_text 2000. is_collapsible, default_collapsed, and has_header_divider are booleans. Available in Messages and Home tabs."

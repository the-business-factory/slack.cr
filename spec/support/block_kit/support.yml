    restrictions: DatePicker supports optional initial value, action ID, plain placeholder, confirm and view-wide focus. Exact YYYY-MM-DD and a valid Gregorian date in years 0001–9999 (local year-range policy), without a scheduling window. Input supports Message, FormModal and Home. Typed action/state strings preserve absent/null/empty and malformed-format strings without outbound validation; wrong JSON types raise TypeMismatch. Other fields remain raw. No datetimepicker or instant parsing.
    implementation_status: supported
    inbound_status: partial
    evidence_paths: [src/slack/ui/block_elements/date_picker.cr, src/slack/interactions/date_picker_action.cr, src/slack/interactions/date_picker_value.cr, spec/ui/date_picker_spec.cr, spec/ui/date_time_placement_spec.cr, spec/interactions/date_time_pickers_spec.cr, spec/api/date_time_pickers_snapshot_spec.cr, examples/block_kit_date_time_pickers.cr]


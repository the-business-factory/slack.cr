# Classification is independent of support status. Missing features are not invalid Slack payloads.
review_policy:
  cadence: Before each release and at least every 90 days.
  procedure: Retrieve the cited fields and Markdown surface metadata; compare meaningful sections with the last review, reconcile SDK conflicts, update reviewed_on and evidence. Page changes trigger review, not automatic implementation failure. Ordinary specs stay offline.
  upstream_releases: [Bolt 5.1.0, "@slack/web-api 8.1.1", "@slack/types 3.1.0"]
  upstream_evidence:
    - url: https://github.com/slackapi/bolt-js/blob/v5.1.0/src/types/actions/block-action.ts
      relevance: UsersSelectAction selected_user, MultiUsersSelectAction selected_users, ChannelsSelectAction selected_channel and MultiChannelsSelectAction selected_channels field types; null and clear semantics follow the full-state changelog.
    - url: https://github.com/slackapi/bolt-js/blob/v5.1.0/test/unit/context/create-say.spec.ts
      relevance: Text/channel/thread forwarding through a stub; no complete Slack schema guarantee.
    - url: https://github.com/slackapi/node-slack-sdk/blob/%40slack/web-api%408.1.1/packages/web-api/src/WebClient.test.ts
      relevance: Request serialization with Nock, compared with local independent wire assertions.
    - url: https://github.com/slackapi/node-slack-sdk/blob/%40slack/web-api%408.1.1/packages/web-api/test/types/methods/chat.test-d.ts
      relevance: Negative content/channel/thread types; icon field exclusion conflicts with chat.postMessage documented precedence and is not imported.
    - url: https://github.com/slackapi/node-slack-sdk/blob/%40slack/types%403.1.0/packages/types/test/views.test-d.ts
      relevance: Modal title is required; SDK type acceptance does not prove server acceptance.
rules:
  - id: text
    classification: "slack_requirement"
    requirement: "Distinct plain_text/mrkdwn formats; text length 1..3000; format-specific emoji/verbatim fields."
    source_url: "https://docs.slack.dev/reference/block-kit/composition-objects/text-object/"
    source_section: "Fields: type, text, emoji, verbatim"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/composition_objects_spec.cr"]
  - id: confirmation
    classification: "slack_requirement"
    requirement: "Title/confirm/deny use plain text; title 100, body 300, buttons 30 characters; primary/danger style."
    source_url: "https://docs.slack.dev/reference/block-kit/composition-objects/confirmation-dialog-object/"
    source_section: "Fields and mrkdwn example"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/composition_objects_spec.cr"]
  - id: button
    classification: "slack_requirement"
    requirement: "Plain text label 75; action_id 255; URL 3000; value 2000; accessibility label 75; agent_prompt 4000; known styles."
    source_url: "https://docs.slack.dev/reference/block-kit/block-elements/button-element/"
    source_section: "Fields"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/button_spec.cr"]
  - id: section
    classification: "slack_requirement"
    requirement: "Text or fields required; at most 10 fields of 2000 characters, text 3000, block_id 255."
    source_url: "https://docs.slack.dev/reference/block-kit/blocks/section-block/"
    source_section: "Fields: text, fields, block_id"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/blocks_spec.cr", "spec/block_kit_diagnostics_spec.cr"]
  - id: actions
    classification: "slack_requirement"
    requirement: "At most 25 elements; action IDs unique within block; block_id 255."
    source_url: "https://docs.slack.dev/reference/block-kit/blocks/actions-block/"
    source_section: "Fields: elements, block_id; element action_id fields"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/blocks_spec.cr"]
  - id: block_ids
    classification: "slack_requirement"
    requirement: "Supplied block IDs are at most 255 and unique in a message or view."
    source_url: "https://docs.slack.dev/reference/block-kit/blocks/input-block/"
    source_section: "Fields: block_id"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/surface_validation_spec.cr", "spec/ui/message_spec.cr"]
  - id: input
    classification: "slack_requirement"
    requirement: "Plain text label and hint at most 2000 characters."
    source_url: "https://docs.slack.dev/reference/block-kit/blocks/input-block/"
    source_section: "Fields: label, hint"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/input_spec.cr", "spec/block_kit_diagnostics_spec.cr"]
  - id: input_surfaces
    classification: "library_support"
    requirement: "Slack documents Messages, Modals, Home; the library supports Input in Message, FormModal and Home. DisplayModal membership stays independent to protect the submit requirement."
    source_url: "https://docs.slack.dev/reference/block-kit/blocks/input-block.md"
    source_section: "available_in_surfaces Markdown metadata"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/input_surfaces_spec.cr", "spec/ui/home_spec.cr", "spec/ui/modal_spec.cr"]
  - id: plain_input
    classification: "slack_requirement"
    requirement: "Placeholder 150, action_id 255, min_length 0..3000, max_length 1..3000; minimum cannot exceed maximum."
    source_url: "https://docs.slack.dev/reference/block-kit/block-elements/plain-text-input-element/"
    source_section: "Fields"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/input_spec.cr"]
  - id: dispatch
    classification: "library_policy"
    requirement: "When provided, dispatch triggers are one or both distinct known enum values; no empty or repeated triggers."
    source_url: "https://docs.slack.dev/reference/block-kit/composition-objects/dispatch-action-configuration-object/"
    source_section: "Fields: trigger_actions_on; documented values"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/input_spec.cr"]
  - id: focus
    classification: "slack_requirement"
    requirement: "Only one focus_on_load=true element per view."
    source_url: "https://docs.slack.dev/reference/block-kit/block-elements/plain-text-input-element/"
    source_section: "Fields: focus_on_load"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/modal_spec.cr", "spec/ui/static_select_spec.cr"]
  - id: message
    classification: "slack_requirement"
    requirement: "Messages contain at most 50 blocks; explicit fallback or Slack-generated fallback controls text omission."
    source_url: "https://docs.slack.dev/block-kit/"
    source_section: "Block limits; chat.postMessage text accessibility guidance"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/message_spec.cr", "spec/api/chat_post_message_spec.cr"]
  - id: modal
    classification: "slack_requirement"
    requirement: "Title/close/submit plain text at most 24; 100 blocks; private_metadata 3000; callback_id 255; Input requires submit."
    source_url: "https://docs.slack.dev/reference/views/modal-views/"
    source_section: "Modal view object fields"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/modal_spec.cr", "spec/block_kit_diagnostics_spec.cr"]
  - id: display_form
    classification: "library_policy"
    requirement: "DisplayModal excludes Input even with submit; FormModal always requires submit, including when no Input is present."
    source_url: "https://docs.slack.dev/reference/views/modal-views/"
    source_section: "Fields: submit (conditional Slack requirement)"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/block_kit_diagnostics_spec.cr", "spec/ui/modal_spec.cr"]
  - id: external_id
    classification: "slack_requirement"
    requirement: "views.open limits view external_id to 255. Home has no corresponding local length limit."
    source_url: "https://docs.slack.dev/reference/methods/views.open/"
    source_section: "views.open Usage info: external_id; compare Modal view object fields: external_id"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/modal_spec.cr", "spec/ui/home_spec.cr"]
    resolution: "Resolved by https://docs.slack.dev/reference/methods/views.open/ Usage info, which explicitly gives 255. The modal field table omits the maximum. No live acceptance test; Home limit remains unestablished."
  - id: home
    classification: "slack_requirement"
    requirement: "Home at most 100 blocks, private_metadata 3000 and callback_id 255."
    source_url: "https://docs.slack.dev/reference/views/home-tab-views/"
    source_section: "Home tab view object fields"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/home_spec.cr"]
  - id: header
    classification: "slack_requirement"
    requirement: "Plain text 150 characters; heading level 1..4."
    source_url: "https://docs.slack.dev/reference/block-kit/blocks/header-block/"
    source_section: "Fields: text, level"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/display_spec.cr"]
  - id: context
    classification: "slack_requirement"
    requirement: "At most 10 text or image elements."
    source_url: "https://docs.slack.dev/reference/block-kit/blocks/context-block/"
    source_section: "Fields: elements"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/display_spec.cr"]
  - id: image
    classification: "slack_requirement"
    requirement: "One image_url or slack_file source; URL 3000; block alt text and plain-text title 2000."
    source_url: "https://docs.slack.dev/reference/block-kit/blocks/image-block/"
    source_section: "Fields: image_url, slack_file, alt_text, title"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/display_spec.cr"]
  - id: video
    classification: "slack_requirement"
    requirement: "Required alt_text, plain-text title, thumbnail_url, and video_url; title and description under 200; author_name under 50; HTTPS video_url and title_url."
    source_url: "https://docs.slack.dev/reference/block-kit/blocks/video-block/"
    source_section: "Fields and usage info"
    reviewed_on: "2026-09-28"
    evidence_paths: ["spec/ui/video_spec.cr"]
  - id: file_block
    classification: "slack_requirement"
    requirement: "Messages only, not added to app surfaces directly (share with files.remote.share or chat.unfurl); required external_id and source \"remote\"; block_id 255."
    source_url: "https://docs.slack.dev/reference/block-kit/blocks/file-block/"
    source_section: "Fields and usage info"
    reviewed_on: "2026-09-28"
    evidence_paths: ["spec/ui/file_block_spec.cr", "spec/block_kit_diagnostics_spec.cr"]
  - id: slack_file
    classification: "slack_requirement"
    requirement: "Exactly one id or url source; remote access and image format cannot be validated offline."
    source_url: "https://docs.slack.dev/reference/block-kit/composition-objects/slack-file-object/"
    source_section: "Fields and usage"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/display_spec.cr"]
  - id: menu_option
    classification: "slack_requirement"
    requirement: "Static option text/description plain text 75, value 150; group label plain text 75; at most 100 options per group."
    source_url: "https://docs.slack.dev/reference/block-kit/composition-objects/option-object/"
    source_section: "Fields: text, value, description; option-group fields"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/static_select_spec.cr"]
  - id: static_select
    classification: "slack_requirement"
    requirement: "Exactly one options or option_groups source, at most 100 entries; initial selections exactly match choices; placeholder 150; action_id 255."
    source_url: "https://docs.slack.dev/reference/block-kit/block-elements/select-menu-element/"
    source_section: "Static select Fields: options, option_groups, initial_option, placeholder, action_id"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/static_select_spec.cr", "spec/block_kit_diagnostics_spec.cr"]
  - id: multi_select
    classification: "slack_requirement"
    requirement: "max_selected_items at least 1; initial selections cannot exceed it; each initial selection matches a choice."
    source_url: "https://docs.slack.dev/reference/block-kit/block-elements/multi-select-menu-element/"
    source_section: "Static multi-select Fields: initial_options, max_selected_items"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/static_select_spec.cr"]
  - id: collection_policy
    classification: "library_policy"
    requirement: "Nonempty Message blocks/fallback, Actions/Context elements, Section fields, option/group lists, image alt text/source and SlackFile source. Choice values and initial selections are unique; immutable snapshots protect ownership."
    source_url: "https://docs.slack.dev/block-kit/"
    source_section: "Local validation stricter than documented maxima; no claim of server rejection"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/message_spec.cr", "spec/ui/blocks_spec.cr", "spec/ui/display_spec.cr", "spec/ui/static_select_spec.cr"]
  - id: declared_types
    classification: "library_policy"
    requirement: "Collections accept supported yielded values even with a broad Enumerable declaration. Typed append/add boundaries copy once into owned arrays; DisplayModal checks the yielded type to retain the FormModal-with-submit diagnostic. No filtering or casts."
    source_url: "https://docs.slack.dev/block-kit/"
    source_section: "Local construction policy, not a Slack schema restriction"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/yielded_collections_spec.cr", "spec/ui/message_composition_spec.cr", "spec/ui/modal_composition_spec.cr", "spec/ui/display_composition_spec.cr", "spec/ui/select_composition_spec.cr"]
  - id: overflow_fields
    classification: "slack_requirement"
    requirement: "Overflow supports up to five options, optional action_id up to 255 characters, and optional confirm. Only Section and Actions placement."
    source_url: "https://docs.slack.dev/reference/block-kit/block-elements/overflow-menu-element/"
    source_section: "Fields and Example placement"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/overflow_spec.cr", "spec/block_kit_diagnostics_spec.cr"]
  - id: overflow_option_fields
    classification: "slack_requirement"
    requirement: "Plain-text label and description up to 75 characters, required unique value up to 150, optional URL up to 3000. URL choices still require interaction acknowledgment."
    source_url: "https://docs.slack.dev/reference/block-kit/composition-objects/option-object/"
    source_section: "Fields: text, value, description, url"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/overflow_spec.cr", "spec/block_kit_consumers_spec.cr"]
  - id: overflow_collection_policy
    classification: "library_policy"
    requirement: "Overflow requires a nonempty option list and takes one owned snapshot of supported yielded values. Getter snapshots cannot change a built request."
    source_url: "https://docs.slack.dev/reference/block-kit/block-elements/overflow-menu-element/"
    source_section: "Local minimum and ownership policy beyond the documented maximum"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/overflow_spec.cr", "spec/api/overflow_snapshot_spec.cr"]
  - id: overflow_received_action
    classification: "library_support"
    requirement: "Typed OverflowAction requires selected_option and IDs, permits optional action_ts, preserves raw fields, and reports malformed known data without outbound validation."
    source_url: "https://docs.slack.dev/tools/bolt-js/reference/interfaces/OverflowAction/"
    source_section: "OverflowAction selected_option, action_id, block_id and action_ts"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/interactions/overflow_spec.cr", "spec/block_kit_consumers_spec.cr"]
  - id: checkbox_fields
    classification: "slack_requirement"
    requirement: "At most ten options, exact initial membership, optional action_id up to 255, confirmation, and focus_on_load. Section/Actions/Input on Messages, Modals and Home."
    source_url: "https://docs.slack.dev/reference/block-kit/block-elements/checkboxes-element.md"
    source_section: "Fields and surface/placement metadata"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/checkboxes_spec.cr"]
  - id: checkbox_option_fields
    classification: "slack_requirement"
    requirement: "Checkbox labels and descriptions accept plain_text or mrkdwn up to 75 characters; values up to 150; no URL."
    source_url: "https://docs.slack.dev/reference/block-kit/composition-objects/option-object/"
    source_section: "Fields: text, value, description, url"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/checkboxes_spec.cr"]
  - id: checkbox_collection_policy
    classification: "library_policy"
    requirement: "Nonempty choices and distinct initial selections; one owned snapshot of supported yielded values. Empty initial selections remain distinct from omission."
    source_url: "https://docs.slack.dev/reference/block-kit/block-elements/checkboxes-element/"
    source_section: "Local minimum and ownership policy"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/checkboxes_spec.cr", "spec/api/checkboxes_snapshot_spec.cr"]
  - id: checkbox_received_selection
    classification: "library_support"
    requirement: "Typed checkbox actions and state preserve absent/null/empty selections and raw fields. A cleared selection is an empty array. Malformed known fields raise TypeMismatch without outbound validation."
    source_url: "https://docs.slack.dev/changelog/2020/09/01/full-state-on-view-submisson-and-block-actions/"
    source_section: "Changes to empty state in all payloads"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/interactions/checkboxes_spec.cr", "spec/block_kit_consumers_spec.cr"]
  - id: radio_fields
    classification: "slack_requirement"
    requirement: "At most ten options, one exact initial option, optional action_id up to 255, confirmation, and focus_on_load. Section/Actions/Input on Messages, Modals and Home."
    source_url: "https://docs.slack.dev/reference/block-kit/block-elements/radio-button-group-element/"
    source_section: "Fields and placement example"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/radio_buttons_spec.cr"]
  - id: radio_option_fields
    classification: "slack_requirement"
    requirement: "Radio labels and descriptions accept plain_text or mrkdwn up to 75 characters; unique values up to 150; no URL."
    source_url: "https://docs.slack.dev/reference/block-kit/composition-objects/option-object/"
    source_section: "Fields: text, value, description, url"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/radio_buttons_spec.cr"]
  - id: radio_collection_policy
    classification: "library_policy"
    requirement: "Nonempty choices; one owned snapshot of supported yielded values. Getter and caller mutations cannot change a built request."
    source_url: "https://docs.slack.dev/reference/block-kit/block-elements/radio-button-group-element/"
    source_section: "Local minimum and ownership policy"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/radio_buttons_spec.cr", "spec/api/radio_buttons_snapshot_spec.cr"]
  - id: radio_received_selection
    classification: "library_support"
    requirement: "Typed radio actions and state preserve absent/null/present selected_option and raw fields. Malformed known fields raise TypeMismatch without outbound validation."
    source_url: "https://docs.slack.dev/changelog/2020/09/01/full-state-on-view-submisson-and-block-actions/"
    source_section: "Changes to empty state in all payloads; radio selected_option also follows official Bolt RadioButtonsAction"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/interactions/radio_buttons_spec.cr", "spec/block_kit_consumers_spec.cr"]
  - id: chat_update_replacement
    classification: "library_policy"
    requirement: "Always replace nonempty blocks and explicit fallback text; reject generated fallback instead of assuming update omission regenerates accessibility text. No partial patch or clearing API."
    source_url: "https://docs.slack.dev/reference/methods/chat.update/"
    source_section: "Usage info: text, blocks or attachments"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/api/chat_update_spec.cr", "spec/block_kit_consumers_spec.cr"]
  - id: chat_update_fields
    classification: "slack_requirement"
    requirement: "Channel and message timestamp select the target; text maximum is 4000 characters. Optional as_user applies to bot-owned updates."
    source_url: "https://docs.slack.dev/reference/methods/chat.update/"
    source_section: "Arguments, Valid message types, Errors: msg_too_long"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/api/chat_update_spec.cr"]
  - id: views_update_target_policy
    classification: "library_policy"
    requirement: "Exactly one nonblank explicit view_id or external_id; never infer a target from nested view metadata. Only the existing Modal union is supported."
    source_url: "https://docs.slack.dev/reference/methods/views.update/"
    source_section: "Arguments and Usage info; exclusive selector choice is library policy"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/api/views_update_spec.cr"]
  - id: views_update_hash_and_inputs
    classification: "slack_requirement"
    requirement: "External target IDs allow 255 characters. Optional hash protects against stale updates; retained input block_id/action_id pairs must match the old view to preserve input state. Local checks prove transmitted IDs, not remote state preservation."
    source_url: "https://docs.slack.dev/reference/methods/views.update/"
    source_section: "Arguments, Preserving input entry, Errors"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/api/views_update_spec.cr", "spec/block_kit_consumers_spec.cr", "examples/support/view_update_example.cr"]
  - id: user_select_fields
    classification: "slack_requirement"
    requirement: "User selects support action_id 255, plain-text placeholder 150, confirm, focus_on_load and initial_user or initial_users. Multi-user max_selected_items is at least one. Section/Actions/Input on Messages, Modals and Home."
    source_url: "https://docs.slack.dev/reference/block-kit/block-elements/multi-select-menu-element.md"
    source_section: "User list fields and placement metadata; single fields in select-menu-element.md"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/users_select_spec.cr", "spec/api/users_select_snapshot_spec.cr"]
  - id: user_select_initial_policy
    classification: "library_policy"
    requirement: "Initial IDs are nonempty, distinct for multi-select and within a supplied maximum. Empty initial arrays differ from omission. One-pass owned snapshots accept supported yielded strings without ID-prefix, length, membership or remote existence restrictions."
    source_url: "https://docs.slack.dev/reference/block-kit/block-elements/multi-select-menu-element/"
    source_section: "Local policy for initial_users and max_selected_items"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/users_select_spec.cr", "spec/api/users_select_snapshot_spec.cr"]
  - id: user_select_received_ids
    classification: "library_support"
    requirement: "Typed selected_user and selected_users actions and state preserve absent/null/empty and raw fields. Malformed known fields raise path-aware TypeMismatch without outbound constraints. Selected array access returns copies."
    source_url: "https://docs.slack.dev/changelog/2020/09/01/full-state-on-view-submisson-and-block-actions/"
    source_section: "Changes to empty state in all payloads; selected ID fields follow Bolt UsersSelectAction and MultiUsersSelectAction (upstream_evidence)"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/interactions/users_select_spec.cr", "spec/block_kit_consumers_spec.cr"]
  - id: views_push_trigger_and_stack
    classification: "slack_requirement"
    requirement: "Push uses a fresh trigger from an interaction inside the existing modal; three views maximum including the root. Trigger validity, expiry, single use and stack depth remain server checks."
    source_url: "https://docs.slack.dev/reference/methods/views.push/"
    source_section: "Usage info and Errors; modal lifecycle guide"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/api/views_push_spec.cr", "examples/support/view_push_example.cr", "spec/block_kit_consumers_spec.cr"]
  - id: views_push_trigger_policy
    classification: "library_policy"
    requirement: "Nonblank opaque trigger_id plus an owned Modal snapshot only. interactivity_pointer omitted; local validation precedes dispatch, and the response is cached without automatic retry."
    source_url: "https://docs.slack.dev/reference/methods/views.push/"
    source_section: "Arguments; trigger-only scope and nonblank check are library policy"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/api/views_push_spec.cr", "spec/api/transport_injection_spec.cr"]

  - id: modal-errors-acknowledgment
    classification: library_support
    reviewed_on: "2026-09-27"
    source_url: "https://docs.slack.dev/surfaces/modals/#display-errors-in-views"
    source_section: "Display errors in views"
    requirement: "Serialize response_action errors with Input block-ID keys and plain-text messages as an HTTP acknowledgment; applications own validation and response timing."
    evidence_paths: ["spec/interactions/modal_errors_spec.cr", "spec/block_kit_consumers_spec.cr", "examples/support/modal_errors_example.cr"]
  - id: modal-errors-useful-feedback
    classification: library_policy
    reviewed_on: "2026-09-27"
    source_url: "https://docs.slack.dev/surfaces/modals/#display-errors-in-views"
    source_section: "Display errors in views"
    requirement: "Require at least one error and nonblank messages; own the supplied map and expose snapshots without imposing message lengths or block-ID formats."
    evidence_paths: ["src/slack/interactions/modal_errors.cr", "spec/interactions/modal_errors_spec.cr"]
  - id: channel_select_fields
    classification: "slack_requirement"
    requirement: "Public-channel selects support action_id 255, plain-text placeholder 150, confirm, focus_on_load and initial_channel or initial_channels. Supplied initial_channels has one or more IDs; multi max_selected_items is at least one. Section/Actions/Input on Messages, Modals and Home. Single response_url_enabled only works in modal Input."
    source_url: "https://docs.slack.dev/reference/block-kit/block-elements/multi-select-menu-element.md"
    source_section: "Public channels fields and placement metadata; single fields in select-menu-element.md"
    reviewed_on: "2026-09-27"
    evidence_paths: ["spec/ui/channels_select_spec.cr", "spec/api/channels_select_snapshot_spec.cr"]
  - id: channel_select_initial_and_placement_policy
    classification: "library_policy"

    surfaces: [message, modal, home]
    restrictions: Complete checked outbound field contract in Message, FormModal and Home Input blocks. Plain text submission values have typed access with absent/null/empty distinction. Dispatched input actions remain UnknownAction; their state has typed access.
    implementation_status: supported
    inbound_status: partial
    evidence_paths: [src/slack/ui/checked/block_elements/plain_text_input.cr, spec/ui/checked/input_spec.cr, spec/interactions/block_kit_spec.cr, examples/block_kit_modal.cr]


  - wire_type: chat.postMessage checked adapter
    kind: endpoint
    documentation_url: https://docs.slack.dev/reference/methods/chat.postMessage/
    fields_supported: [channel, text, blocks, thread_ts, reply_broadcast, unfurl_links, unfurl_media]
    parents: []
    surfaces: [message]
    restrictions: The checked adapter is partial. Use the legacy ChatPostMessage request for attachments, parse, link_names, mrkdwn, username, icon_emoji, or icon_url; these fields are outside the checked guarantee. Neither request supports metadata, markdown_text, or draft fields.
    implementation_status: partial
    inbound_status: unsupported
    evidence_paths: [src/slack/api/endpoints/checked_chat_post_message.cr, spec/api/checked_chat_post_message_spec.cr, spec/block_kit_consumers_spec.cr]

  - wire_type: chat.update checked adapter
    kind: endpoint
    documentation_url: https://docs.slack.dev/reference/methods/chat.update/
    fields_supported: [channel, ts, text, blocks, as_user]
    parents: []
    surfaces: [message]
    restrictions: Replaces text and nonempty blocks from an owned checked Message. Explicit fallback of 1–4000 characters is required; generated fallback, partial patches, text-only updates and block clearing are unsupported. Channel must be nonblank; timestamp stays a decimal string without fixed digit counts. Optional as_user preserves false and omission. Attachments and metadata are omitted and retained; parse and link_names use Slack update defaults. Other method fields are unsupported. String token and existing dispatch injection are required as for checked posting. UpdateMessage exposes channel, ts, text and optional raw message. Slack checks ownership, permissions, non-ephemeral message state and rendering.
    implementation_status: partial
    inbound_status: partial
    evidence_paths: [src/slack/api/endpoints/checked_chat_update.cr, src/slack/models/chat/update_message.cr, spec/api/checked_chat_update_spec.cr, spec/api/transport_injection_spec.cr, examples/block_kit_message_update.cr, spec/block_kit_consumers_spec.cr]


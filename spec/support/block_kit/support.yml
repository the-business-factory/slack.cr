    parents: [input]
    surfaces: [modal]
    restrictions: Checked UrlInput checks action_id (255) and plain placeholder (150) limits and sends initial_value unchanged; Slack documents no format rule for it. Only FormModal accepts it, through the modal-only ModalInput block; Message, Home and DisplayModal reject it at compile time. Typed UrlInputAction and UrlInputValue keep the entered string with absent/null/present presence; Slack checks URL format in the client and the library does not check it again. Wrong JSON types raise TypeMismatch.
    implementation_status: supported
    inbound_status: partial
    evidence_paths: [src/slack/ui/checked/block_elements/url_input.cr, src/slack/ui/checked/blocks/modal_input.cr, src/slack/interactions/url_input_action.cr, src/slack/interactions/url_input_value.cr, spec/ui/checked/url_input_spec.cr, spec/interactions/url_input_spec.cr, spec/block_kit_consumers_spec.cr, examples/block_kit_url_input.cr]


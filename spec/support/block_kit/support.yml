  - id: card_carousel_policy
    classification: library_policy
    requirement: "Card actions is sent as a plain button array, following Slack's examples rather than the Actions block type in the field table. An empty actions array is rejected (omit actions instead). Supplied action IDs are unique within a card, card block IDs are unique within a carousel, and card and carousel block_id have at most 255 characters."
    source_url: https://docs.slack.dev/reference/block-kit/blocks/card-block/
    source_section: "Fields: actions, block_id; Example"

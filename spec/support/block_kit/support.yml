  - wire_type: number_input
    kind: block element
    documentation_url: https://docs.slack.dev/reference/block-kit/block-elements/number-input-element/
    fields_supported: [type, is_decimal_allowed, action_id, initial_value, min_value, max_value, dispatch_action_config, focus_on_load, placeholder]
    parents: [input]
    surfaces: [modal]
    restrictions: Checked NumberInput requires is_decimal_allowed and sends numbers as strings unchanged. Slack requires min_value <= max_value; the library compares exact decimal strings. Library policy requires plain decimal strings (optional minus, digits, optional fraction) and whole numbers when decimals are not allowed. An initial value outside the range is not checked locally. Only FormModal accepts it, through the modal-only ModalInput block; Message, Home and DisplayModal reject it at compile time. Typed NumberInputAction and NumberInputValue keep value strings with absent/null/empty presence and without numeric parsing; wrong JSON types raise TypeMismatch.
    implementation_status: supported
    inbound_status: partial
    evidence_paths: [src/slack/ui/checked/block_elements/number_input.cr, src/slack/ui/checked/blocks/modal_input.cr, src/slack/interactions/number_input_action.cr, src/slack/interactions/number_input_value.cr, spec/ui/checked/number_input_spec.cr, spec/interactions/number_input_spec.cr, spec/api/number_input_snapshot_spec.cr, spec/block_kit_diagnostics_spec.cr, examples/block_kit_number_input.cr]


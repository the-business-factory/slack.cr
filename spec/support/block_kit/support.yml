    parents: [section, actions, input]
    surfaces: [message, modal, home]
    restrictions: Checked Checkboxes accepts one to ten CheckboxOption values with unique values and exact distinct initial selections. Input remains limited to Message, FormModal and Home. Focus participates in the single-focus rule for views. Typed CheckboxesAction and CheckboxesValue retain absent/null/cleared selections and raw fields without outbound validation. Legacy placeholder remains unsupported.
    implementation_status: supported
    inbound_status: partial
    evidence_paths: [src/slack/ui/checked/block_elements/checkboxes.cr, src/slack/interactions/checkboxes_action.cr, src/slack/interactions/checkboxes_value.cr, spec/ui/checked/checkboxes_spec.cr, spec/interactions/checkboxes_spec.cr, spec/api/checkboxes_snapshot_spec.cr, examples/block_kit_checkboxes.cr]


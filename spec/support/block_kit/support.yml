    parents: []
    surfaces: [modal]
    restrictions: CheckedViewsOpen composes the existing transport and validates result and call. external_id belongs inside view. Trigger-based opening only; interactivity_pointer is deferred. Responses retain the existing ViewsOpen model with raw view JSON.
    implementation_status: partial
    inbound_status: partial
    evidence_paths: [src/slack/api/endpoints/checked_views_open.cr, spec/api/checked_views_open_spec.cr, spec/block_kit_consumers_spec.cr]

  - wire_type: views.update checked adapter
    kind: endpoint
    documentation_url: https://docs.slack.dev/reference/methods/views.update/
    fields_supported: [view, view_id, external_id, hash]
    parents: []
    surfaces: [modal]
    restrictions: CheckedViewsUpdate owns a FormModal or DisplayModal snapshot. Exactly one nonblank explicit target selector is library policy; external_id allows 255 characters. Top-level external_id selects the target independently of nested view metadata. Optional hash is opaque, including empty string; no automatic conflict retry or state migration. Input block/action IDs are sent unchanged; matching old IDs and live state preservation are not locally verified. Home uses views.publish. ViewsUpdate exposes ok and raw view JSON. Token, configuration, transport and limiter are dispatch options, not JSON fields.
    implementation_status: supported
    inbound_status: partial
    evidence_paths: [src/slack/api/endpoints/checked_views_update.cr, src/slack/models/views/views_update.cr, spec/api/checked_views_update_spec.cr, spec/api/transport_injection_spec.cr, spec/block_kit_consumers_spec.cr, examples/block_kit_view_update.cr]


  - id: carousel_block
    classification: slack_requirement
    requirement: "elements is required and holds 1 to 10 card blocks; block_id is optional. Available in Messages and Home tabs."
    source_url: https://docs.slack.dev/reference/block-kit/blocks/carousel-block.md
    source_section: "Fields, Example, and available_in_surfaces metadata"

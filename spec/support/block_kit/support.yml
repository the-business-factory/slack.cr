    restrictions: CheckboxOption accepts plain_text or mrkdwn labels and descriptions up to 75 characters and values up to 150. No URL. Separate from static-select Option and OverflowOption. Received SelectedOption exposes value, text, and text_type; description and unknown fields remain raw.

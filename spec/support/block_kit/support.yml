schema_version: 2
checked_on: "2026-09-27"
scope: Checked Block Kit values, surface builders, static selections, overflow menus, checkboxes, and radio buttons, including Input in Messages, FormModal and Home.
statuses:
  - unsupported
  - partial
  - supported
entries:

  - id: container_policy
    classification: library_policy
    requirement: "Outbound containers need one or more child blocks. Home rejects a File child because Slack documents the File block for messages only; Slack does not document a File child on Home. A container does not nest another container."
    source_url: https://docs.slack.dev/reference/block-kit/blocks/container-block
    source_section: "Fields: child_blocks; Supported child blocks"

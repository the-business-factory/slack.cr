  - id: interaction_context
    classification: library_support
    requirement: "block_actions container decodes message, view, and message_attachment types; other types stay Container::Unknown with raw JSON, and a non-object container raises TypeMismatch. channel, hash, function_data, and bot_access_token are typed; bot_access_token is a redacted Auth::Secret. view_submission response_urls are typed; view_closed is_cleared is typed. View getters read id, title, callback_id, private_metadata, external_id, hash, and related fields. Received message and view blocks and interactivity stay raw JSON."

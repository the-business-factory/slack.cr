  - wire_type: number_input
    kind: block element
    documentation_url: https://docs.slack.dev/reference/block-kit/block-elements/number-input-element/
    fields_supported: [type, is_decimal_allowed, action_id, initial_value, min_value, max_value, dispatch_action_config, focus_on_load, placeholder]
    parents: [input]
    surfaces: [modal]
    restrictions: NumberInput requires is_decimal_allowed and sends numbers as strings unchanged. Slack requires min_value <= max_value; the library compares exact decimal strings. Library policy requires plain decimal strings (optional minus, digits, optional fraction) and whole numbers when decimals are not allowed. An initial value outside the range is not checked locally. Only FormModal accepts it, through the modal-only ModalInput block; Message, Home and DisplayModal reject it at compile time. Typed NumberInputAction and NumberInputValue keep value strings with absent/null/empty presence and without numeric parsing; wrong JSON types raise TypeMismatch.
    implementation_status: supported
    inbound_status: partial
    evidence_paths: [src/slack/ui/block_elements/number_input.cr, src/slack/ui/blocks/modal_input.cr, src/slack/interactions/number_input_action.cr, src/slack/interactions/number_input_value.cr, spec/ui/number_input_spec.cr, spec/interactions/number_input_spec.cr, spec/api/number_input_snapshot_spec.cr, spec/block_kit_diagnostics_spec.cr, examples/block_kit_number_input.cr]

  - wire_type: url_text_input
    kind: block element
    documentation_url: https://docs.slack.dev/reference/block-kit/block-elements/url-input-element/
    fields_supported: [type, action_id, initial_value, dispatch_action_config, focus_on_load, placeholder]
    parents: [input]
    surfaces: [modal]
    restrictions: UrlInput checks action_id (255) and plain placeholder (150) limits and sends initial_value unchanged; Slack documents no format rule for it. Only FormModal accepts it, through the modal-only ModalInput block; Message, Home and DisplayModal reject it at compile time. Typed UrlInputAction and UrlInputValue keep the entered string with absent/null/present presence; Slack checks URL format in the client and the library does not check it again. Wrong JSON types raise TypeMismatch.
    implementation_status: supported
    inbound_status: partial
    evidence_paths: [src/slack/ui/block_elements/url_input.cr, src/slack/ui/blocks/modal_input.cr, src/slack/interactions/url_input_action.cr, src/slack/interactions/url_input_value.cr, spec/ui/url_input_spec.cr, spec/interactions/url_input_spec.cr, spec/block_kit_consumers_spec.cr, examples/block_kit_url_input.cr]

  - wire_type: email_text_input
    kind: block element
    documentation_url: https://docs.slack.dev/reference/block-kit/block-elements/email-input-element/
    fields_supported: [type, action_id, initial_value, dispatch_action_config, focus_on_load, placeholder]
    parents: [input]
    surfaces: [modal]
    restrictions: EmailInput checks action_id and placeholder limits and sends initial_value unchanged; Slack documents no address syntax rule, so the library checks none. Only FormModal accepts it, through the modal-only ModalInput block; Message, Home and DisplayModal reject it at compile time. Typed EmailInputAction and EmailInputValue keep value strings with absent/null/empty presence and without address checks; wrong JSON types raise TypeMismatch.
    implementation_status: supported
    inbound_status: partial
    evidence_paths: [src/slack/ui/block_elements/email_input.cr, src/slack/ui/blocks/modal_input.cr, src/slack/interactions/email_input_action.cr, src/slack/interactions/email_input_value.cr, spec/ui/email_input_spec.cr, spec/interactions/email_input_spec.cr, examples/block_kit_email_input.cr]

  - wire_type: rich_text_input
    kind: block element
    documentation_url: https://docs.slack.dev/reference/block-kit/block-elements/rich-text-input-element/
    fields_supported: [type, action_id, initial_value, dispatch_action_config, focus_on_load, placeholder, min_lines, max_lines]
    parents: [input]
    surfaces: [modal, home]
    restrictions: RichTextInput requires action_id, as Slack documents; a nonempty action_id is library policy. initial_value is a Blocks::RichText. min_lines and max_lines must each be from 1 to 100; Slack documents no rule between them. Only FormModal and Home accept it, through the view-only ViewInput block; Message and DisplayModal reject it at compile time. Slack also lists the Table block as a parent; that placement is not implemented. Typed RichTextInputAction and RichTextInputValue read rich_text_value with the received rich text parser and keep absent/null presence; malformed trees and wrong JSON types raise path-aware TypeMismatch.
    implementation_status: supported
    inbound_status: supported
    evidence_paths: [src/slack/ui/block_elements/rich_text_input.cr, src/slack/ui/blocks/view_input.cr, src/slack/interactions/rich_text_input_action.cr, src/slack/interactions/rich_text_input_value.cr, spec/ui/rich_text_input_spec.cr, spec/interactions/rich_text_input_spec.cr, spec/api/rich_text_input_snapshot_spec.cr, spec/block_kit_diagnostics_spec.cr, examples/block_kit_rich_text_input.cr]


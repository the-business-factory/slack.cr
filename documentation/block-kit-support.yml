    kind: block element
    documentation_url: https://docs.slack.dev/reference/block-kit/block-elements/select-menu-element/
    fields_supported: [type]
    parents: []
    surfaces: []
    restrictions: Discriminator-only placeholder; source variants are not modeled.
    implementation_status: unsupported
    inbound_status: unsupported
    evidence_paths: [src/slack/ui/block_elements/select_menu.cr]

  - wire_type: timepicker
    kind: block element
    documentation_url: https://docs.slack.dev/reference/block-kit/block-elements/time-picker-element/
    fields_supported: [type]
    parents: []
    surfaces: []
    restrictions: Discriminator-only placeholder; not in a supported placement union.
    implementation_status: unsupported
    inbound_status: unsupported
    evidence_paths: [src/slack/ui/block_elements/time_picker.cr]

  - wire_type: actions
    kind: block
    documentation_url: https://docs.slack.dev/reference/block-kit/blocks/actions-block/
    fields_supported: [type, block_id, elements]
    parents: [message, modal]
    surfaces: [message, modal]
    restrictions: Checked and legacy implementations accept only Button elements; other Slack interactive elements are not yet admitted. Checked collections are immutable snapshots and validate duplicate supplied action IDs.
    implementation_status: partial
    inbound_status: partial
    evidence_paths: [src/slack/ui/checked/blocks/actions.cr, spec/ui/checked/blocks_spec.cr, spec/fixtures/compile/fail/phase_2_invalid_actions_element.cr, src/slack/ui/blocks/actions.cr]

  - wire_type: input
    kind: block
    documentation_url: https://docs.slack.dev/reference/block-kit/blocks/input-block/
    fields_supported: [type, label, element, dispatch_action, block_id, hint, optional]
    parents: [modal]
    surfaces: [modal]
    restrictions: Checked Input accepts only PlainTextInput in FormModal; all Input fields are supported. Other elements and Home placement are deferred. Legacy Input retains its previous partial contract.
    implementation_status: partial
    inbound_status: partial
    evidence_paths: [src/slack/ui/checked/blocks/input.cr, spec/ui/checked/input_spec.cr, spec/fixtures/compile/fail/phase_3_display_input.cr, spec/interactions/block_kit_spec.cr]

  - wire_type: section
    kind: block
    documentation_url: https://docs.slack.dev/reference/block-kit/blocks/section-block/
    fields_supported: [type, text, fields, accessory, block_id, expand]
    parents: [message, modal]
    surfaces: [message, modal]
    restrictions: Checked Section supports text, fields, block_id, expand, and Button accessories. Other documented accessory element families are deferred and the legacy type still accepts broad mutable children.
    implementation_status: partial
    inbound_status: partial
    evidence_paths: [src/slack/ui/checked/blocks/section.cr, spec/ui/checked/blocks_spec.cr, spec/fixtures/compile/fail/invalid_accessory.cr, src/slack/ui/blocks/section.cr]

  - wire_type: divider
    kind: block
    documentation_url: https://docs.slack.dev/reference/block-kit/blocks/divider-block/
    fields_supported: [type, block_id]
    parents: [message, modal]
    surfaces: [message, modal]
    restrictions: The checked Divider has the complete current outbound contract; the pre-existing short-name placeholder remains unsupported during coexistence.
    implementation_status: supported
    inbound_status: unsupported
    evidence_paths: [src/slack/ui/checked/blocks/divider.cr, spec/ui/checked/blocks_spec.cr, spec/ui/checked/message_spec.cr]

  - wire_type: context, file, header, and image blocks
    kind: block
    documentation_url: https://docs.slack.dev/reference/block-kit/blocks/
    fields_supported: []
    parents: []
    surfaces: []
    restrictions: Empty source placeholders; not supported wire implementations.
    implementation_status: unsupported
    inbound_status: unsupported
    evidence_paths: [src/slack/ui/blocks/context.cr, src/slack/ui/blocks/file.cr, src/slack/ui/blocks/header.cr, src/slack/ui/blocks/image.cr]

  - wire_type: Block Kit message payload
    kind: surface
    documentation_url: https://docs.slack.dev/block-kit/
    fields_supported: [text, blocks]
    parents: [chat.postMessage]
    surfaces: [message]
    restrictions: Supports explicit fallback text or the separately named Slack-generated fallback choice and a checked union of Section, Actions, and Divider. Other block families remain unsupported until their slices ship.
    implementation_status: supported
    inbound_status: partial
    evidence_paths: [src/slack/ui/checked/surfaces/message.cr, src/slack/ui/checked/message_builder.cr, spec/ui/checked/message_spec.cr, examples/block_kit_message.cr]

  - wire_type: chat.postMessage checked adapter
    kind: endpoint
    documentation_url: https://docs.slack.dev/reference/methods/chat.postMessage/
    fields_supported: [channel, text, blocks, thread_ts, reply_broadcast, unfurl_links, unfurl_media]
    parents: []
    surfaces: [message]
    restrictions: The checked adapter is partial. Use the legacy ChatPostMessage request for attachments, parse, link_names, mrkdwn, username, icon_emoji, or icon_url; these fields are outside the checked guarantee. Neither request supports metadata, markdown_text, or draft fields.
    implementation_status: partial
    inbound_status: unsupported
    evidence_paths: [src/slack/api/endpoints/checked_chat_post_message.cr, spec/api/checked_chat_post_message_spec.cr, spec/fixtures/compile/pass/phase_2_endpoint.cr, spec/fixtures/compile/fail/phase_2_request_deserialization.cr]

  - wire_type: modal view
    kind: surface
    documentation_url: https://docs.slack.dev/reference/views/modal-views/
    fields_supported: [type, title, submit, close, blocks, private_metadata, callback_id, external_id, clear_on_close, notify_on_close, submit_disabled]
    parents: [views.open]
    surfaces: [modal]
    restrictions: Checked DisplayModal excludes Input; FormModal requires submit. The block catalog is limited to Section, Actions, Divider, and plain text Input. submit_disabled is for Slack configuration modals only. View lifecycle responses and Home views are deferred. Legacy Modal keeps its previous contract.
    implementation_status: partial
    inbound_status: partial
    evidence_paths: [src/slack/ui/checked/surfaces/form_modal.cr, src/slack/ui/checked/surfaces/display_modal.cr, spec/ui/checked/modal_spec.cr, spec/block_kit_phase_3_compile_spec.cr, examples/block_kit_modal.cr]

  - wire_type: views.open checked adapter
    kind: endpoint
    documentation_url: https://docs.slack.dev/reference/methods/views.open/
    fields_supported: [trigger_id, view]
    parents: []
    surfaces: [modal]
    restrictions: CheckedViewsOpen composes the existing transport and validates result and call. external_id belongs inside view. Trigger-based opening only; interactivity_pointer is deferred. Responses retain the existing ViewsOpen model with raw view JSON.
    implementation_status: partial
    inbound_status: partial
    evidence_paths: [src/slack/api/endpoints/checked_views_open.cr, spec/api/checked_views_open_spec.cr, spec/fixtures/compile/pass/phase_3_endpoint.cr]

  - wire_type: block_actions and view_submission
    kind: interaction payload
    documentation_url: https://docs.slack.dev/reference/interaction-payloads/view-interactions-payload/
    fields_supported: [actions, state, view.state.values]
    parents: []
    surfaces: [message, modal, home]
    restrictions: Additive typed button decoding and plain text StateMap access through Interaction.from_json and process_interaction. UnknownAction and UnknownStateValue retain raw JSON. Other actions, state families, and response actions have no typed contract. Existing optional fields and raw access remain available; inbound Home tolerance does not certify outbound Home placement.
    implementation_status: partial
    inbound_status: partial
    evidence_paths: [src/slack/interactions/action_decoder.cr, src/slack/interactions/state_map.cr, spec/interactions/block_kit_spec.cr, examples/block_kit_modal.cr]

name: CI

on:
  - push
  - pull_request

permissions:
  contents: read

jobs:
  Ameba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: Format
        run: crystal tool format --check

      - name: Install shards
        run: shards install

      - name: Run ameba linter
        run: crystal run lib/ameba/src/cli.cr

  Tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.21.0

      - name: Install shards
        run: shards install

      - name: Run tests
        run: crystal spec

      - name: Generate docs
        run: crystal docs
